stages:
  - lint
  - test_unit
  - test_feature

lint:
  stage: lint
  image: php:8.4
  before_script:
    - apt-get update && apt-get install -y unzip git
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction --prefer-dist --working-dir=backend
  script:
    - php backend/vendor/bin/phpcs --standard=PSR12 backend/app/ backend/routes/
  only:
    - merge_requests

unit_tests:
  stage: test_unit
  image: php:8.4
  before_script:
    - apt-get update && apt-get install -y unzip git
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction --prefer-dist --working-dir=backend
  script:
    - php backend/vendor/bin/phpunit --configuration backend/phpunit.xml --testsuite=Unit
  only:
    - merge_requests

feature_tests:
  stage: test_feature
  image: php:8.4
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: ':memory:'
    APP_KEY: $APP_KEY
  before_script:
    - apt-get update && apt-get install -y unzip git
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction --prefer-dist --working-dir=backend
  script:
    - php backend/vendor/bin/phpunit --configuration backend/phpunit.xml --testsuite=Feature
  only:
    - merge_requests
