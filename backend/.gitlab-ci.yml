lint:
  stage: lint
  image: php:8.4
  before_script:
    - apt-get update && apt-get install -y unzip git
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction --prefer-dist --working-dir=backend
  script:
    - php backend/vendor/bin/phpcs --standard=PSR12 backend/app/ backend/routes/
  only:
    - merge_requests

unit_tests:
  stage: test_unit
  image: php:8.4
  variables:
    APP_ENV: testing
    DB_CONNECTION: sqlite
    DB_DATABASE: ':memory:'
    CACHE_STORE: array
    QUEUE_CONNECTION: sync
  before_script:
    - apt-get update && apt-get install -y unzip git libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install gd
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction --prefer-dist --working-dir=backend
  script:
    - php backend/vendor/bin/phpunit --configuration backend/phpunit.xml --testsuite=Unit
  only:
    - merge_requests

feature_tests:
  stage: test_feature
  environment: test
  image: php:8.4
  services:
    - name: mysql:8.0
      alias: mysql_test
  variables:
    MYSQL_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD}
    MYSQL_DATABASE: ${TEST_DB_DATABASE}
    MYSQL_USER: ${TEST_DB_USERNAME}
    MYSQL_PASSWORD: ${TEST_DB_PASSWORD}
    APP_ENV: testing
    DB_CONNECTION: mysql
    DB_HOST: mysql_test
    DB_PORT: "3306"
    DB_DATABASE: ${TEST_DB_DATABASE}
    DB_USERNAME: ${TEST_DB_USERNAME}
    DB_PASSWORD: ${TEST_DB_PASSWORD}
    APP_KEY: ${APP_KEY}
  before_script:
    - apt-get update && apt-get install -y unzip git libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-install pdo_mysql
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install gd
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction --prefer-dist --working-dir=backend
    - echo "APP_KEY=${APP_KEY}"
    - echo "DB_DATABASE=${TEST_DB_DATABASE}"
    - echo "DB_USERNAME=${TEST_DB_USERNAME}"
    - echo "DB_PASSWORD=${TEST_DB_PASSWORD}"
    - echo "MYSQL_ROOT_PASSWORD=${TEST_DB_ROOT_PASSWORD}"
    - sleep 5
    - php backend/artisan migrate --env=testing
  script:
    - php backend/vendor/bin/phpunit --configuration backend/phpunit.xml --testsuite=Feature
  only:
    - merge_requests

deploy_acceptance_backend:
  stage: deploy_acceptance
  image: php:8.4
  services:
    - name: mysql:8.0
      alias: mysql_acceptance
  variables:
    MYSQL_ROOT_PASSWORD: ${ACCEPTANCE_DB_ROOT_PASSWORD}
    MYSQL_DATABASE: ${ACCEPTANCE_DB_DATABASE}
    MYSQL_USER: ${ACCEPTANCE_DB_USERNAME}
    MYSQL_PASSWORD: ${ACCEPTANCE_DB_PASSWORD}
    APP_ENV: acceptance
    DB_CONNECTION: mysql
    DB_HOST: mysql_acceptance
    DB_PORT: "3306"
    DB_DATABASE: ${ACCEPTANCE_DB_DATABASE}
    DB_USERNAME: ${ACCEPTANCE_DB_USERNAME}
    DB_PASSWORD: ${ACCEPTANCE_DB_PASSWORD}
    APP_KEY: ${APP_KEY}
  before_script:
    - apt-get update && apt-get install -y unzip git libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-install pdo_mysql
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install gd
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-interaction --prefer-dist --working-dir=backend
    - sleep 5
    - php backend/artisan migrate --env=acceptance --force
  script:
    - echo "Running acceptance tests..."
    - php backend/vendor/bin/phpunit --configuration backend/phpunit.xml --testsuite=Feature
  environment:
    name: acceptance
  only:
    - main

deploy_production:
  stage: deploy_production
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init
    - terraform destroy -auto-approve
    - terraform apply -auto-approve
  environment:
    name: production
  when: manual
  only:
    - main
  dependencies: []
